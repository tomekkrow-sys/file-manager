name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # mozna uruchomic recznie z zakladki Actions

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean file_manager.spec
      - name: Zip
        run: Compress-Archive -Path dist\file-manager -DestinationPath file-manager-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: file-manager-windows
          path: file-manager-windows.zip

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System dependencies (Qt offscreen libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
      - name: Build DEB
        run: ./build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: file-manager-deb
          path: file-manager_*_amd64.deb
